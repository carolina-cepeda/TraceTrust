[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetrust"
version = "0.1.0"
description = "Auditable analytical layer for agroindustrial traceability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "networkx>=3.2",
  "pydantic>=2.7",
  "scikit-learn>=1.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]
postgres = [
  "psycopg[binary]>=3.2",
]
neo4j = [
  "neo4j>=5.20",
]

[tool.setuptools.packages.find]
include = ["tracetrust*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
